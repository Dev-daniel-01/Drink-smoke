<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drink &amp; Smoke | Loja</title>
    <link rel="icon" type="image/png" href="../Assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="../Assets/theme.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
</head>
<body>

    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="./">
                <img src="../Assets/logo.png" alt="Drink and Smoke">
                <span>Drink &amp; Smoke</span>
            </a>

            <div class="site-header__actions">
                <div class="user-chip">
                    <span class="user-chip__avatar" id="user-avatar">?</span>
                    <span class="user-chip__name">Bem-vindo, <strong id="user"></strong></span>
                </div>
                <a class="icon-link" href="../Carrinho" aria-label="Ir para o carrinho">
                    <img src="../Assets/carrinho-de-compras.png" alt="Carrinho">
                    <span class="badge-count" id="cart-badge" style="display:none">0</span>
                </a>
                <button class="btn-icon btn-outline btn" id="logout-btn" title="Sair" aria-label="Sair">⏻</button>
            </div>
        </div>
    </header>

    <main class="page-bg shop-bg">
        <div class="shop-hero">
            <p class="shop-hero__eyebrow">Distribuidora &amp; Açougue</p>
            <h1>Nossos Produtos</h1>
        </div>

        <div class="wrap">
            <div id="produtos-container" class="produtos-grid"></div>
        </div>

        <footer class="site-footer">
            <a target="_blank" href="https://www.instagram.com/"><img src="../Assets/instagram.png" alt="Instagram"></a>
            <a target="_blank" href="https://www.facebook.com/?locale=pt_BR"><img src="../Assets/facebook.png" alt="Facebook"></a>
            <a target="_blank" href="https://x.com/?lang=pt"><img src="../Assets/twitter.png" alt="Twitter"></a>
            <a target="_blank" href="https://www.whatsapp.com/?lang=pt_BR"><img src="../Assets/whatsapp.png" alt="whatsapp"></a>
        </footer>
    </main>

    <script src="../Assets/ui.js"></script>
    <script src="script.js"></script>
</body>
</html>
